<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senegal Gaming Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: arcade select-screen energy, delivered with the calm of a national institution.
   IDEA: a game's character-select and level-up HUD; the registration is a 4-level run.
   PICTURE: an orbit HUD — Senegal's green star at the core, eight role glyphs on the ring.
   COLOUR and TYPE: night navy, neon green lead, cyan support, violet accent, flag stripe; Chakra Petch + Inter.
   LAYOUT: one column for missions, cards grid for players, panels grid for organisers. */
:root{color-scheme:dark;--bg:#060a18;--bg2:#0b1230;--panel:rgba(15,23,54,.78);--panel2:#111a40;--line:rgba(130,165,255,.18);--line2:rgba(130,165,255,.32);--ink:#eaf0ff;--mute:#9eabd3;--g:#39ff88;--c:#22d3ee;--v:#a78bfa;--warn:#ffb547;--bad:#ff5d73;--sg:#00853f;--sy:#fdef42;--sr:#e31b23;--r:14px;--hf:"Chakra Petch",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 500px at 85% -10%,rgba(167,139,250,.18),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(34,211,238,.12),transparent 60%),radial-gradient(600px 400px at 50% 110%,rgba(57,255,136,.10),transparent 60%),linear-gradient(var(--bg),var(--bg2))}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(130,165,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(130,165,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(#000,transparent 85%)}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
h1,h2,h3{font-family:var(--hf);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
a{color:var(--c)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.flag{height:4px;background:linear-gradient(90deg,var(--sg) 0 33.3%,var(--sy) 33.3% 66.6%,var(--sr) 66.6%)}
header.top{position:sticky;top:0;z-index:30;background:rgba(6,10,24,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:10px max(4vw,14px)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--hf);font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;margin-inline-end:auto;background:none;border:0;cursor:pointer;padding:6px 0}
.logo svg{width:28px;height:28px}
.tog{display:flex;gap:6px;flex-wrap:wrap}
.ib{min-height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink);font:600 13px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ib[aria-pressed=true]{border-color:var(--g);color:var(--g);background:rgba(57,255,136,.08)}
.ib svg{width:18px;height:18px;flex:none}
@media(max-width:600px){.logo span{font-size:13px}.tog .ib span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tog .ib{padding:0 10px}}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,40px) max(4vw,14px) 80px}
.btn{--bc:var(--g);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border:0;cursor:pointer;font:700 16px var(--hf);letter-spacing:.04em;color:#03130a;background:var(--bc);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transition:transform .15s,filter .15s;box-shadow:0 0 0 transparent}
.btn:hover{filter:brightness(1.12) drop-shadow(0 0 12px var(--bc));transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);outline:1px solid var(--line2);outline-offset:-1px;clip-path:none;border-radius:12px}
.btn.ghost:hover{outline-color:var(--c);filter:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.big{min-height:62px;font-size:18px;padding:0 34px}
.btn.pulse::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.5vw,28px)}
.muted{color:var(--mute)}
.small{font-size:13px}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(20px,4vw,56px);align-items:center;min-height:min(78vh,720px)}
.kicker{font:600 14px var(--hf);color:var(--c);display:flex;gap:8px;align-items:center;margin-bottom:14px}
.kicker i{width:22px;height:2px;background:var(--c);display:block}
.title{font-size:clamp(42px,7.4vw,88px);font-weight:700;line-height:.95;background:linear-gradient(95deg,#fff 10%,var(--g) 55%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(57,255,136,.25))}
.sig{font:600 15px var(--hf);color:var(--v);margin:14px 0 18px}
.lead{font-size:clamp(18px,2.2vw,22px);font-weight:600;margin:0 0 8px}
.ev{margin:22px 0;display:grid;gap:10px}
.ev h2{font-size:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mute);font-size:15px}
.meta span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.meta svg{width:16px;height:16px;color:var(--c)}
.obj{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.obj li{display:flex;gap:10px;align-items:flex-start}
.obj li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;background:var(--g);transform:rotate(45deg);box-shadow:0 0 8px var(--g)}
.cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:8px}
.timer{display:inline-flex;gap:8px;align-items:center;color:var(--g);font:600 14px var(--hf)}
.timer svg{width:18px;height:18px}
.orbit{position:relative;aspect-ratio:1;width:100%;max-width:520px;justify-self:center}
.orbit svg{width:100%;height:100%;overflow:visible}
.spin{transform-origin:200px 200px;animation:spin 70s linear infinite}
.spin.r{animation-direction:reverse;animation-duration:110s}
@keyframes spin{to{transform:rotate(360deg)}}
.node{transition:transform .2s}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,181,71,.4);background:rgba(255,181,71,.08);color:#ffd9a0;font-size:14px}
/* HUD progress */
.hud{display:grid;gap:10px;margin-bottom:22px}
.hudrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 14px var(--hf)}
.hudrow b{color:var(--g)}
.segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg{height:12px;border-radius:3px;background:rgba(255,255,255,.07);border:1px solid var(--line);position:relative;overflow:hidden;transform:skewX(-18deg)}
.seg.on{background:linear-gradient(90deg,var(--g),var(--c));box-shadow:0 0 12px rgba(57,255,136,.5);border-color:transparent}
.seg.cur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(57,255,136,.6),transparent);animation:scan 1.6s infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.mhead{display:grid;gap:8px;margin-bottom:22px}
.mtag{font:700 13px var(--hf);color:var(--c)}
.mhead h1{font-size:clamp(28px,4.4vw,44px)}
/* player cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.pc{--rc:var(--g);position:relative;text-align:start;padding:0;border:1px solid var(--line2);border-radius:16px;background:var(--panel2);color:var(--ink);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s;font:inherit}
.pc:hover,.pc:focus-visible{transform:translateY(-4px);border-color:var(--rc);box-shadow:0 10px 30px -10px var(--rc)}
.pc[aria-checked=true]{border-color:var(--rc);box-shadow:0 0 0 2px var(--rc),0 0 30px -6px var(--rc)}
.pc .art{position:relative;aspect-ratio:16/10;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 65%),repeating-linear-gradient(60deg,transparent 0 14px,rgba(255,255,255,.035) 14px 15px),linear-gradient(160deg,#141f4d,#0a1029)}
.pc .art svg{width:46%;height:auto;max-height:80%;color:var(--rc);filter:drop-shadow(0 0 10px var(--rc));transition:transform .25s}
.pc:hover .art svg{transform:scale(1.08) rotate(-3deg)}
.pc .lv{position:absolute;top:8px;inset-inline-start:8px;font:700 11px var(--hf);padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.45);color:var(--rc)}
.pc .ok{position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;border-radius:50%;background:var(--rc);color:#04130b;display:none;place-items:center}
.pc[aria-checked=true] .ok{display:grid}
.pc .tx{padding:12px 14px 14px;display:grid;gap:4px}
.pc h3{font-size:18px;color:var(--rc)}
.pc .role{font-weight:600;font-size:14px}
.pc .desc{font-size:13px;color:var(--mute);line-height:1.4}
@media(max-width:600px){.pc .desc{display:none}.pc h3{font-size:15px}.pc .role{font-size:13px}}
/* forms */
.form{display:grid;gap:18px;max-width:760px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}}
.fld{display:grid;gap:6px}
.fld>label,.lbl{font-weight:600;font-size:15px}
.opt{color:var(--mute);font-weight:400;font-size:13px}
.req{color:var(--g)}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;min-height:48px;padding:11px 14px;font:16px Inter,sans-serif;color:var(--ink);background:rgba(5,9,26,.85);border:1px solid var(--line2);border-radius:12px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--c) 50%),linear-gradient(135deg,var(--c) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:40px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
[aria-invalid=true]{border-color:var(--bad)!important}
.err{color:var(--bad);font-size:13px;min-height:0}
.hint{color:var(--mute);font-size:13px}
.phone{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer;text-align:start;transition:all .15s}
.chip:hover{border-color:var(--c)}
.chip[aria-pressed=true]{background:rgba(57,255,136,.12);border-color:var(--g);color:#c9ffe0;box-shadow:0 0 12px -4px var(--g)}
.chip[aria-pressed=true]::before{content:"✓ ";color:var(--g)}
.chip[aria-disabled=true]{opacity:.4;cursor:not-allowed}
.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.quests .chip{border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.quests .chip::before{display:none}
.qi{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(34,211,238,.1);color:var(--c);font:700 13px var(--hf)}
.chip[aria-pressed=true] .qi{background:var(--g);color:#04130b}
.slot{display:flex;gap:6px;align-items:center;font:600 14px var(--hf);color:var(--mute)}
.slot i{width:22px;height:8px;border-radius:2px;background:rgba(255,255,255,.1);display:block}
.slot i.on{background:var(--g);box-shadow:0 0 8px var(--g)}
.count{text-align:end;font-size:13px;color:var(--mute)}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;max-width:760px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line2);border-radius:12px;background:rgba(255,255,255,.02);cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--g)}
.linkb{background:none;border:0;color:var(--c);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
/* player card / pass */
.pass{--rc:var(--g);position:relative;max-width:440px;width:100%;border-radius:20px;padding:2px;background:linear-gradient(135deg,var(--rc),var(--v),var(--c));box-shadow:0 20px 60px -20px var(--rc)}
.pass>div{border-radius:18px;background:radial-gradient(400px 200px at 100% 0,color-mix(in srgb,var(--rc) 25%,transparent),transparent),linear-gradient(170deg,#121b45,#070c22);padding:22px;display:grid;gap:14px;overflow:hidden;position:relative}
.pass>div::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.08) 45%,transparent 55%);pointer-events:none;animation:holo 5s ease-in-out infinite}
@keyframes holo{0%,100%{transform:translateX(-60%)}50%{transform:translateX(60%)}}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 12px var(--hf);color:var(--mute)}
.pname{font:700 clamp(24px,4vw,30px)/1.1 var(--hf)}
.prole{display:flex;gap:10px;align-items:center;font:600 16px var(--hf);color:var(--rc)}
.prole svg{width:28px;height:28px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;font-size:14px}
.pgrid dt{color:var(--mute);font-size:12px}
.pgrid dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ptags{display:flex;flex-wrap:wrap;gap:6px}
.ptags span{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.qr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding-top:12px;border-top:1px dashed var(--line2)}
.qr .code{width:120px;height:120px;background:#fff;border-radius:10px;padding:6px}
.qr .code svg{width:100%;height:100%;display:block}
.pid{font:700 20px var(--hf);color:var(--g);letter-spacing:.06em;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--hf);padding:4px 10px;border-radius:999px;background:rgba(57,255,136,.12);color:var(--g);border:1px solid rgba(57,255,136,.4);white-space:nowrap}
.stat.w{background:rgba(255,181,71,.12);color:var(--warn);border-color:rgba(255,181,71,.4)}
.summary{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:860px){.summary{grid-template-columns:minmax(0,1fr)}}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bdg{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);font-size:14px}
.bdg .hx{width:36px;height:36px;display:grid;place-items:center;color:#04130b;background:var(--bc,var(--g));clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.bdg .hx svg{width:18px;height:18px}
.bdg b{display:block;font-family:var(--hf)}
/* overlay */
#ov{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(3,6,16,.78);backdrop-filter:blur(6px);text-align:center;padding:20px}
#ov.show{display:grid}
#ov .u{font:700 clamp(30px,6vw,60px) var(--hf);color:var(--g);text-shadow:0 0 30px var(--g);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#ov .s{font:600 clamp(16px,2.4vw,22px) var(--hf);color:var(--ink);margin-top:12px;animation:fade .6s .15s both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.done{text-align:center;display:grid;gap:12px;justify-items:center;margin-bottom:28px;position:relative;overflow-x:clip}
.done h1{font-size:clamp(40px,8vw,84px);color:var(--g);text-shadow:0 0 40px rgba(57,255,136,.6);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.burst{position:absolute;top:40px;left:50%;width:10px;height:10px;pointer-events:none}
.burst i{position:absolute;width:8px;height:8px;border-radius:2px;animation:fly 1.4s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(3,6,16,.8);padding:16px}
.modal.show{display:grid}
.modal .panel{max-width:640px;width:100%;max-height:86vh;overflow:auto;background:#0d1538}
.alert{padding:14px 16px;border-radius:12px;border:1px solid rgba(255,93,115,.45);background:rgba(255,93,115,.1);color:#ffc3cc}
.okmsg{padding:14px 16px;border-radius:12px;border:1px solid rgba(57,255,136,.45);background:rgba(57,255,136,.08);color:#c9ffe0}
/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 22px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{min-height:42px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:none;color:var(--mute);font:600 15px var(--hf);cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.4)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.kpi .n{font:700 clamp(28px,4vw,40px) var(--hf);color:var(--g);line-height:1}
.kpi .l{color:var(--mute);font-size:13px;margin-top:6px}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:860px){.dash{grid-template-columns:minmax(0,1fr)}}
.dash h2{font-size:19px;margin-bottom:14px}
.bars{display:grid;gap:9px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:4px 10px;align-items:center;font-size:14px}
.brow .bt{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.brow .track{height:10px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;grid-column:1;grid-row:2}
.brow .fill{height:100%;border-radius:3px;background:var(--bc,var(--c))}
.brow .v{text-align:end;font-variant-numeric:tabular-nums;font-weight:600;grid-column:2;grid-row:2;white-space:nowrap;font-size:13px}
.brow .bt span:last-child{display:none}
.carto{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1.15;border-radius:8px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;line-height:1.15;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.tile b{font:700 18px var(--hf)}
.tile.e{visibility:hidden}
.feed{display:grid;gap:10px;max-height:420px;overflow:auto;padding-inline-end:4px}
.feed blockquote{margin:0;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);border-inline-start:3px solid var(--bc,var(--c))}
.feed cite{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-top:6px}
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(max-width:860px){.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar>:first-child{grid-column:1/-1}}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--mute);font-weight:600;font-size:12px;padding:10px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td .ib{min-height:36px}
.dup{color:var(--warn);font-size:12px;font-weight:600}
.empty{padding:30px;text-align:center;color:var(--mute)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;max-width:640px}
.dl{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:8px 16px;font-size:14px}
.dl dt{color:var(--mute)}.dl dd{margin:0;overflow-wrap:anywhere}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr);min-height:0}.orbit{max-width:300px;order:-1;margin:-6px auto -10px}.btn.big{width:100%}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}.dl{grid-template-columns:minmax(0,1fr)}.dl dd{margin-bottom:6px}}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
footer{max-width:1240px;margin:0 auto;padding:20px max(4vw,14px) 40px;color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;border-top:1px solid var(--line)}

async function api(path,opt={}){const h={'Content-Type':'application/json',apikey:SB.key};if(TOK&&!opt.anon)h.Authorization='Bearer '+TOK;if(opt.prefer)h.Prefer=opt.prefer;let r;try{r=await fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'})}catch(e){throw {code:'network'}}let j=null;const txt=await r.text();try{j=txt?JSON.parse(txt):null}catch(e){}
 if(!r.ok){const c=(j&&(j.message||j.error_code||j.error))||('http'+r.status);if(r.status===401&&TOK&&!opt.keep){if(await refreshTok())return api(path,{...opt,keep:true});logout(false)}throw {code:c,status:r.status,msg:j&&(j.message||j.error_description||j.msg)}}return j}
async function refreshTok(){if(!RTOK)return false;try{const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:RTOK},anon:true,keep:true});TOK=j.access_token;RTOK=j.refresh_token;LS.set('sgq.tok',TOK);LS.set('sgq.rtok',RTOK);return true}catch(e){return false}}

function fxSize(){cv.width=innerWidth;cv.height=innerHeight;P=Array.from({length:Math.min(36,Math.round(innerWidth/30))},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.4,vy:-(Math.random()*.25+.05),c:['#39ff88','#22d3ee','#a78bfa'][Math.floor(Math.random()*3)]}))}
function fxLoop(){cx.clearRect(0,0,cv.width,cv.height);for(const p of P){p.y+=p.vy;if(p.y<-5)p.y=cv.height+5;cx.globalAlpha=.55;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}raf=requestAnimationFrame(fxLoop)}
function fxApply(){cancelAnimationFrame(raf);cx.clearRect(0,0,cv.width,cv.height);if(!PREF.rm&&!document.hidden)fxLoop()}

 case 'reload':loadRegs();break;
 case 'privacy':privacy();break;
 case 'mclose':closeModal();break;
 case 'lang':L=L==='fr'?'en':'fr';LS.set('sgq.lang',L);errs={};render(false);break;
 case 'snd':PREF.snd=!PREF.snd;LS.set('sgq.pref',PREF);chrome();blip(880,.08);break;
 case 'rm':PREF.rm=!PREF.rm;LS.set('sgq.pref',PREF);chrome();fxApply();break;
 case 'admin':history.replaceState(null,'','#admin');S.view='admin';adminSubscribe();render();break;
 case 'atab':A.tab=id;render(false);break;
 case 'afiche':fiche(id);break;
 case 'aci':toggleCI(id);break;
 case 'adel':delReg(id,b);break;
 case 'csv':exportCSV();break;
 case 'xlsx':exportXLSX();break;
 }});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f){S.f[el.dataset.f]=el.value;if(errs[el.dataset.f]){delete errs[el.dataset.f];el.removeAttribute('aria-invalid');const er=$('#e_'+el.dataset.f);if(er)er.textContent=''}if(el.dataset.f==='region'){const w=$('#wCountry');if(w)w.hidden=el.value!=='intl'}saveDraft()}
 else if(el.dataset.sp){S.spec[el.dataset.sp]=el.value;saveDraft()}
 else if(el.dataset.x){S[el.dataset.x]=el.value;if(el.dataset.x==='contrib')$('#cc').textContent=el.value.length+'/250';saveDraft()}
 else if(el.dataset.af){A[el.dataset.af]=el.value;fillPeople()}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.c){S[el.dataset.c]=el.checked;if(el.dataset.c==='consent'&&el.checked){delete errs.consent;$('#e_consent').textContent=''}saveDraft()}else if(el.dataset.af){A[el.dataset.af]=el.value;fillPeople()}else if(el.dataset.f){S.f[el.dataset.f]=el.value;saveDraft()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;if(f==='settings')saveSettings(e.target);else if(f==='login')login(e.target);else if(f==='find')doFind();else if(f==='ci'){const v=$('#ciq').value;ciResult(findPass(v));$('#ciq').select()}else if(f==='m2')next()});
addEventListener('hashchange',()=>{if(location.hash==='#admin'){S.view='admin';adminSubscribe();render()}else if(location.hash==='#retrouver')openFind()});
addEventListener('online',()=>{if(lastErr===t('eNet')){lastErr='';if(S.view==='m4')render(false)}});

/* ---------- boot ---------- */
fxSize();fxApply();render(false);
if(restored){setTimeout(()=>live(t('resume')),400)}
loadScript(['vendor/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js']).then(()=>{if(S.view==='done')render(false)}).catch(()=>{});
async function loadCfg(){try{const j=await api('/rest/v1/event_settings?select=*&id=eq.1',{anon:true,keep:true});const it=j&&j[0]?fromDb(j[0]):null;if(it){CFGID=it.id;CFG={...CFG_DEF};for(const k in CFG_DEF)if(it[k]!==undefined&&it[k]!==null)CFG[k]=it[k]}OFFLINE=false}catch(e){OFFLINE=true}DBREADY=true;if(['home','done'].includes(S.view)||(S.view==='admin'&&A.tab!=='settings'))render(false)}
(async()=>{await loadCfg();
 if(TOK){try{const ok=await api('/rest/v1/rpc/is_organizer',{method:'POST',body:{}});if(ok===true)ADMIN=true;else logout(false)}catch(e){if(e.status===401||e.status===403)logout(false)}}
 if(location.hash==='#admin'){S.view='admin';if(ADMIN)adminSubscribe();render()}else if(location.hash==='#retrouver')openFind();
 chrome();setInterval(()=>{if(OFFLINE)loadCfg()},20000)})();
}
